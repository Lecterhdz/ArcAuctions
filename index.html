<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ArcAuctions | Powered by Arc Reactor</title>
  <link rel="manifest" href="/ArcAuctions/manifest.json">
  <meta name="theme-color" content="#0057B3">
  <link rel="stylesheet" href="/ArcAuctions/css/styles.css">
</head>
<body data-theme="jarvis">
  <div class="login-container">
    <div class="reactor-ring"></div>
    <h1>⚡ ARCAUCTIONS</h1>
    <p class="subtitle">Jarvis / Ultron Mode • Powered by Stark Industries</p>
    
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit" class="btn-rounded">ACCEDER AL ARC</button>
    </form>
    
    <button id="demo-btn" class="btn-outline">🎮 MODO DEMO (3 pujas/hora)</button>
    <p class="hint">Demo: demo@arcauctions.com / 123456</p>
  </div>

  <!-- Botón circular flotante para cambiar tema -->
  <button id="theme-fab" class="theme-fab" title="Cambiar tema Jarvis/Ultron">
    🌓
  </button>

  <script type="module">
    import { initAuth } from '/ArcAuctions/js/auth.js';
    
    // Inicializar tema guardado
    const savedTheme = localStorage.getItem('theme') || 'jarvis';
    document.body.setAttribute('data-theme', savedTheme);
    
    // Botón de tema
    const themeFab = document.getElementById('theme-fab');
    if (themeFab) {
      themeFab.onclick = () => {
        const current = document.body.getAttribute('data-theme') || 'jarvis';
        const newTheme = current === 'jarvis' ? 'ultron' : 'jarvis';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        
        // Feedback visual
        themeFab.style.transform = 'scale(1.2)';
        setTimeout(() => {
          themeFab.style.transform = 'scale(1)';
        }, 200);
      };
    }
    
    initAuth();
  </script>
</body>
</html>
