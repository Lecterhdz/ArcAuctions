<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ArcAuctions | Powered by Arc Reactor</title>
  <meta name="description" content="Plataforma de subastas inteligente estilo Iron Man. Modo Jarvis y Ultron.">
  <meta name="theme-color" content="#0057B3">
  <link rel="manifest" href="/ArcAuctions/manifest.json">
  <link rel="stylesheet" href="/ArcAuctions/css/styles.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    /* Login container más compacto */
    .login-container {
      max-width: 420px;
      width: 90%;
      margin: 40px auto;
      text-align: center;
      padding: 40px 30px;
      background: var(--card-bg);
      border-radius: 40px;
      box-shadow: 0 0 40px var(--shadow);
      position: relative;
      z-index: 10;
    }
    
    /* Logo y reactor ARC (visible) */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .arc-reactor-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .reactor-core {
      width: 25px;
      height: 25px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--accent-glow);
      animation: pulseCore 2s ease-in-out infinite;
      z-index: 2;
    }
    
    .reactor-ring-inner {
      position: absolute;
      width: 55px;
      height: 55px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      animation: rotateRing 3s linear infinite;
    }
    
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulseCore {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    
    /* Título */
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    
    /* Subtítulo más compacto */
    .subtitle {
      font-size: 14px;
      font-weight: 500;
      margin: 8px 0;
    }
    
    .jarvis-text, .ultron-text {
      font-size: 13px;
      font-weight: 600;
    }
    
    body.theme-jarvis .jarvis-text {
      color: #0057B3;
    }
    
    body.theme-ultron .ultron-text {
      color: #E63946;
    }
    
    .separator {
      margin: 0 6px;
      opacity: 0.5;
      font-size: 12px;
    }
    
    .subtitle-small {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 5px;
    }
    
    /* Efecto glitch SOLO en modo Ultron (visible) */
    body.theme-ultron .glitch-text {
      animation: glitch 3s infinite;
    }
    
    @keyframes glitch {
      0%, 100% { transform: skew(0deg, 0deg); }
      96% { transform: skew(3deg, 1deg); opacity: 0.9; }
      97% { transform: skew(-2deg, -1deg); }
      98% { transform: skew(2deg, 2deg); }
      99% { transform: skew(-1deg, -2deg); }
    }
    
    /* Inputs flotantes modernos */
    .input-group {
      position: relative;
      margin-bottom: 25px;
    }
    
    .input-group label {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      transition: all 0.2s ease;
      pointer-events: none;
      opacity: 0.6;
    }
    
    .input-group input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      transition: all 0.2s ease;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    
    .input-group.focused label,
    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: 0;
      transform: translateY(-50%) scale(0.85);
      background: var(--card-bg);
      padding: 0 8px;
      left: 15px;
      opacity: 1;
    }
    
    /* Botones */
    .btn-rounded {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-rounded:hover {
      transform: scale(1.02);
      filter: brightness(1.1);
    }
    
    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 20px;
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 40px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-outline:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .demo-badge {
      font-size: 9px;
      background: var(--accent);
      color: white;
      padding: 2px 6px;
      border-radius: 20px;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
      opacity: 0.3;
    }
    
    .divider span {
      margin: 0 12px;
      font-size: 11px;
      opacity: 0.5;
    }
    
    /* Info card compacta */
    .info-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 10px;
      margin-top: 20px;
      text-align: center;
      border-left: 3px solid var(--accent);
      font-size: 12px;
    }
    
    .version-tag {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 9px;
      opacity: 0.4;
    }
    
    /* Partículas visibles */
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      animation: floatParticle linear infinite;
    }
    
    body.theme-jarvis .particle {
      background: #0057B3;
    }
    
    body.theme-ultron .particle {
      background: #E63946;
    }
    
    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.5;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-100vh) translateX(20px);
        opacity: 0;
      }
    }
    
    /* Botón tema con tooltip */
    .theme-fab {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 22px;
      cursor: pointer;
      z-index: 1001;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .fab-tooltip {
      position: absolute;
      right: 55px;
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 10px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s;
      pointer-events: none;
      border: 1px solid var(--border);
    }
    
    .theme-fab:hover .fab-tooltip {
      opacity: 1;
      visibility: visible;
      right: 60px;
    }
    
    .fab-ripple {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      animation: ripple 0.4s ease-out;
      pointer-events: none;
    }
    
    @keyframes ripple {
      from { transform: scale(0.5); opacity: 0.8; }
      to { transform: scale(2); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="particles-bg" id="particles-container"></div>
  
  <div class="login-container">
    <!-- Logo con reactor ARC visible -->
    <div class="logo-container">
      <div class="arc-reactor-icon">
        <div class="reactor-core"></div>
        <div class="reactor-ring-inner"></div>
      </div>
      <h1 class="glitch-text">⚡ ARCAUCTIONS</h1>
    </div>
    
    <p class="subtitle">
      <span class="jarvis-text">J.A.R.V.I.S.</span>
      <span class="separator">⟡</span>
      <span class="ultron-text">U.L.T.R.O.N.</span>
    </p>
    <p class="subtitle-small">Powered by Stark Industries</p>
    
    <form id="login-form">
      <div class="input-group">
        <input type="email" id="email" placeholder=" " required>
        <label for="email">Correo electrónico</label>
      </div>
      
      <div class="input-group">
        <input type="password" id="password" placeholder=" " required>
        <label for="password">Contraseña</label>
      </div>
      
      <button type="submit" class="btn-rounded">
        ACCEDER AL ARC ⚡
      </button>
    </form>
    
    <div class="divider">
      <span>o</span>
    </div>
    
    <button id="demo-btn" class="btn-outline">
      🎮 MODO DEMO
      <span class="demo-badge">3 pujas/hora</span>
    </button>
    
    <div class="info-card">
      demo@arcauctions.com / 123456
    </div>
    
    <div class="version-tag">
      <span>v2.1</span>
      <span>•</span>
      <span>ARC Reactor</span>
    </div>
  </div>

  <button id="theme-fab" class="theme-fab">
    🌓
    <span class="fab-tooltip">JARVIS / ULTRON</span>
  </button>

  <script type="module">
    import { initAuth } from '/ArcAuctions/js/auth.js';
    import { initTheme, toggleTheme, getCurrentTheme } from '/ArcAuctions/js/theme.js';
    
    initTheme();
    
    // Crear partículas
    function createParticles() {
      const container = document.getElementById('particles-container');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 10 + 's';
        particle.style.animationDuration = 5 + Math.random() * 15 + 's';
        container.appendChild(particle);
      }
    }
    
    createParticles();
    
    const themeFab = document.getElementById('theme-fab');
    if (themeFab) {
      themeFab.onclick = (e) => {
        e.preventDefault();
        toggleTheme();
        
        themeFab.style.transform = 'scale(1.2)';
        const ripple = document.createElement('span');
        ripple.classList.add('fab-ripple');
        themeFab.appendChild(ripple);
        setTimeout(() => {
          themeFab.style.transform = 'scale(1)';
          ripple.remove();
        }, 300);
        
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          const newTheme = getCurrentTheme();
          metaTheme.setAttribute('content', newTheme === 'jarvis' ? '#0057B3' : '#E63946');
        }
      };
    }
    
    const inputs = document.querySelectorAll('.input-group input');
    inputs.forEach(input => {
      input.addEventListener('focus', () => input.parentElement.classList.add('focused'));
      input.addEventListener('blur', () => {
        if (!input.value) input.parentElement.classList.remove('focused');
      });
      if (input.value) input.parentElement.classList.add('focused');
    });
    
    initAuth();
  </script>
</body>
</html>
