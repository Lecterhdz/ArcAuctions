<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ArcAuctions | Dashboard</title>
  <meta name="theme-color" content="#0057B3">
  <link rel="manifest" href="/ArcAuctions/manifest.json">
  <link rel="stylesheet" href="/ArcAuctions/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Reset y base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--text); padding: 80px 20px 20px 20px; min-height: 100vh; }
    
    /* Header con z-index correcto */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
      padding-left: 60px;
    }
    
    .dashboard-title h2 { font-size: 22px; margin: 0; }
    .dashboard-title p { font-size: 12px; opacity: 0.6; margin: 4px 0 0; }
    
    /* Stats cards más compactas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
      padding-left: 60px;
    }
    
    .stat-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid var(--accent);
    }
    
    .stat-value { font-size: 28px; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 11px; opacity: 0.7; margin-top: 5px; }
    
    /* User badge */
    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 6px 16px 6px 8px;
      border-radius: 50px;
    }
    
    .avatar-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
    }
    
    .user-info { display: flex; flex-direction: column; align-items: flex-start; }
    .user-email { font-size: 12px; font-weight: 500; }
    .plan-badge { font-size: 10px; padding: 2px 10px; border-radius: 20px; background: var(--border); }
    
    /* Menú hamburguesa fijo y visible */
    .menu-hamburger {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 22px;
      cursor: pointer;
      z-index: 1002;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    
    /* Cards de subastas compactas */
    .cards-grid { display: flex; flex-direction: column; gap: 15px; }
    .card-rectangular {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      border-left: 4px solid var(--accent);
      transition: 0.2s;
    }
    
    .auction-price { font-size: 24px; font-weight: 800; color: var(--accent); margin: 8px 0; }
    .bid-button { margin-top: 12px; width: 100%; }
    
    /* Loading skeleton visible */
    .skeleton {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      margin: 10px 0;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Toast notifications */
    .toast {
      position: fixed;
      bottom: 80px;
      right: 20px;
      background: var(--card-bg);
      padding: 10px 18px;
      border-radius: 30px;
      border-left: 3px solid var(--accent);
      z-index: 1003;
      animation: slideIn 0.3s ease;
      font-size: 13px;
    }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    /* Botón tema */
    .theme-fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
      z-index: 1001;
    }
    
    .fab-tooltip {
      position: absolute;
      right: 50px;
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 10px;
      white-space: nowrap;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
    }
    
    .theme-fab:hover .fab-tooltip { opacity: 1; right: 55px; }
    
    @media (max-width: 768px) {
      body { padding: 70px 15px 15px 15px; }
      .dashboard-header, .stats-grid { padding-left: 0; }
      .dashboard-header { flex-direction: column; align-items: flex-start; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .stat-value { font-size: 22px; }
    }
  </style>
</head>
<body>
  <button id="menu-btn" class="menu-hamburger">☰</button>

  <nav id="side-menu" class="side-menu">
    <div class="menu-header"><h3>⚡ ARCAUCTIONS</h3><p class="version">v2.1</p></div>
    <button class="menu-item" data-view="auctions">📡 Subastas</button>
    <button class="menu-item" data-view="profile">👤 Mi Perfil</button>
    <button class="menu-item" data-view="history">📜 Historial</button>
    <button class="menu-item logout" id="logout-btn">🔒 Cerrar Sesión</button>
  </nav>

  <main id="main-content">
    <div class="dashboard-header">
        <div class="dashboard-title">
          <h2>Bienvenido, <span id="user-display">Invitado</span></h2>
          <p>ARC Reactor Online • <span id="active-auctions-count">0</span> subastas activas</p>
        </div>
      <div class="user-badge">
        <div class="avatar-circle">⚡</div>
        <div class="user-info">
          <span id="user-email" class="user-email">Cargando...</span>
          <span class="plan-badge" id="plan-badge">DEMO</span>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="total-bids">0</div><div class="stat-label">Mis Pujas</div></div>
      <div class="stat-card"><div class="stat-value" id="bids-remaining-stats">3</div><div class="stat-label">Pujas Restantes</div></div>
      <div class="stat-card"><div class="stat-value" id="active-auctions">0</div><div class="stat-label">Subastas Activas</div></div>
    </div>

    <div id="auctions-view" class="view active">
      <h2 style="margin-bottom: 15px;">🔥 Subastas ARC</h2>
      <div id="auctions-container" class="cards-grid"><div class="skeleton">🔄 Cargando subastas...</div></div>
    </div>

    <div id="profile-view" class="view">
      <h2 style="margin-bottom: 15px;">🤖 Mi Perfil</h2>
      <div class="card-rectangular">
        <p><strong>Email:</strong> <span id="profile-email">-</span></p>
        <p><strong>Plan:</strong> <span id="profile-plan">-</span></p>
        <p><strong>Pujas restantes:</strong> <span id="bids-remaining">-</span></p>
        <button id="upgrade-pro" class="btn-rounded" style="margin-top: 15px;">🚀 Upgrade a PRO (24h demo)</button>
      </div>
    </div>

    <div id="history-view" class="view">
      <h2 style="margin-bottom: 15px;">📜 Historial</h2>
      <div id="history-container"><div class="skeleton">📭 Cargando historial...</div></div>
    </div>
  </main>

  <button id="theme-fab" class="theme-fab">🌓<span class="fab-tooltip">JARVIS / ULTRON</span></button>

  <script type="module">
    import { checkAuth, logout, getCurrentUser } from '/ArcAuctions/js/auth.js';
    import { loadAuctions, placeBid } from '/ArcAuctions/js/auction.js';
    import { initTheme, toggleTheme, getCurrentTheme } from '/ArcAuctions/js/theme.js';
    import { upgradeToPro, loadUserProfile, loadBidHistory } from '/ArcAuctions/js/app.js';
    import { db } from '/ArcAuctions/js/firebase-config.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    async function updateStats(user) {
      const bidsSnap = await getDocs(query(collection(db, "bids"), where("userId", "==", user.uid)));
      const auctionsSnap = await getDocs(collection(db, "auctions"));
      const userSnap = await getDocs(query(collection(db, "users"), where("email", "==", user.email)));
      let remaining = 3;
      if (!userSnap.empty) {
        const userData = userSnap.docs[0].data();
        remaining = userData.plan === 'pro' ? '∞' : Math.max(0, 3 - (userData.bidsToday || 0));
      }
      document.getElementById('total-bids').textContent = bidsSnap.size;
      document.getElementById('bids-remaining-stats').textContent = remaining;
      document.getElementById('active-auctions').textContent = auctionsSnap.size;
    }

    async function init() {
      const user = await checkAuth();
      if (!user) return;
      
      initTheme();
      await loadUserProfile(user);
      await loadAuctions(user);
      await updateStats(user);
      
      document.getElementById('user-display').textContent = user.email.split('@')[0];
      document.getElementById('user-email').textContent = user.email;
      
      const menuBtn = document.getElementById('menu-btn');
      const sideMenu = document.getElementById('side-menu');
      menuBtn.onclick = () => sideMenu.classList.toggle('open');
      
      document.getElementById('theme-fab').onclick = () => { toggleTheme(); showToast('🎨 Tema cambiado'); };
      document.getElementById('logout-btn').onclick = () => logout();
      document.getElementById('upgrade-pro').onclick = async () => { await upgradeToPro(user); location.reload(); };
      
      document.querySelectorAll('.menu-item[data-view]').forEach(btn => {
        btn.onclick = (e) => {
          const view = e.target.getAttribute('data-view');
          document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
          document.getElementById(`${view}-view`).classList.add('active');
          if (view === 'history') loadBidHistory(user);
          sideMenu.classList.remove('open');
        };
      });
      
      window.placeBid = async (id, price) => { await placeBid(user, id, price); showToast('⚡ ¡Puja realizada!'); await updateStats(user); };
    }
    
    init();
  </script>
</body>
</html>
